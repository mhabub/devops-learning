name: Deploy HTML Site

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v1

      - name: File contents
        run: cat hello.txt
   
      - name: Deploy to VM
        run: | 
          cd /var/www/html/devops-learning
          git pull origin develop